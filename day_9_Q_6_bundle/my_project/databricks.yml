# This is a Declarative Automation Bundle definition for my_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: my_project
  uuid: 505f89de-2fed-4392-9d33-cef5e8c1211d

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-2bd5e4bd-405a.cloud.databricks.com
    variables:
      catalog: dev
      schema: bronze
  prod:
    mode: production
    workspace:
      host: https://dbc-2bd5e4bd-405a.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/d96d1ee0-ac8a-415c-9d26-f982765a6e1b to make sure we only have a single copy.
      root_path: /Workspace/Users/d96d1ee0-ac8a-415c-9d26-f982765a6e1b/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod
      schema: bronze
    permissions:
      - service_principal_name: 0c28e675-641f-49ef-81a9-b5625f2257b4
        level: CAN_MANAGE
